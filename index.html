<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>เกมคัดแยกอาหาร</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    overflow: hidden;
    touch-action: manipulation;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        linear-gradient(180deg, #38bdf8 0%, #7dd3fc 45%, #dcfce7 45%, #bbf7d0 100%);
}

/* =====================
   TOP BAR
===================== */

#topBar {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: 12px;
    right: 12px;
    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.box {
    background: rgba(15, 23, 42, 0.88);
    border: 3px solid white;
    border-radius: 18px;
    padding: 10px 16px;

    font-size: 20px;
    font-weight: bold;
    color: white;

    box-shadow: 0 4px 10px rgba(0,0,0,.25);
}

#soundButton {
    cursor: pointer;
    touch-action: manipulation;
}

/* =====================
   GAME AREA
===================== */

#gameArea {
    position: absolute;
    top: 85px;
    bottom: 150px;
    left: 0;
    right: 0;

    overflow: hidden;
}

/* =====================
   FOOD
===================== */

.food {
    position: absolute;

    width: 105px;
    min-height: 105px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    background: rgba(255,255,255,.94);

    border: 4px solid white;
    border-radius: 25px;

    box-shadow: 0 8px 15px rgba(0,0,0,.25);

    cursor: pointer;

    touch-action: manipulation;

    user-select: none;

    transition:
        transform .15s,
        box-shadow .15s;
}

.food:active {
    transform: scale(.95);
}

.foodEmoji {
    font-size: 48px;
    line-height: 1;
}

.foodName {
    margin-top: 6px;

    font-size: 15px;
    font-weight: bold;

    color: #111827;

    text-align: center;
}

.food.selected {
    border-color: #facc15;

    transform: scale(1.12);

    box-shadow:
        0 0 0 6px rgba(250,204,21,.55),
        0 10px 20px rgba(0,0,0,.3);
}

/* =====================
   BASKETS
===================== */

#baskets {
    position: absolute;

    bottom: 15px;
    left: 10px;
    right: 10px;

    z-index: 15;

    display: flex;

    gap: 10px;
}

.basket {
    flex: 1;

    min-height: 120px;

    border: 5px solid white;
    border-radius: 25px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    color: white;

    font-size: 20px;

    font-weight: bold;

    text-align: center;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow:
        0 7px 15px rgba(0,0,0,.25);

    transition: transform .15s;
}

.basket:active {
    transform: scale(.96);
}

#healthyBasket {
    background: #16a34a;
}

#toxicBasket {
    background: #2563eb;
}

.basketIcon {
    font-size: 42px;
}

/* =====================
   FEEDBACK
===================== */

#feedback {
    position: absolute;

    top: 95px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(-20px);

    z-index: 50;

    padding: 14px 22px;

    border-radius: 20px;

    font-size: 24px;
    font-weight: bold;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s,
        transform .25s;

    white-space: nowrap;
}

#feedback.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================
   START SCREEN
===================== */

#startScreen {
    position: absolute;

    inset: 0;

    z-index: 100;

    background:
        linear-gradient(
            135deg,
            rgba(15,23,42,.97),
            rgba(30,41,59,.97)
        );

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;
}

#startScreen h1 {
    margin: 0 0 15px;

    font-size: 36px;

    color: #facc15;
}

#startScreen p {
    font-size: 19px;

    line-height: 1.6;

    max-width: 550px;
}

/* =====================
   LEVELS
===================== */

#levels {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin: 15px 0 20px;
}

.levelButton {
    padding: 13px 18px;

    border: 3px solid white;

    border-radius: 18px;

    background: #334155;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;
}

.levelButton.active {
    background: #facc15;

    color: #111827;
}

/* =====================
   START BUTTON
===================== */

#startButton {
    padding: 20px 38px;

    border: 5px solid white;

    border-radius: 28px;

    background: #facc15;

    color: #111827;

    font-size: 28px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow:
        0 8px 20px rgba(0,0,0,.3);
}

#startButton:active {
    transform: scale(.96);
}

/* =====================
   INSTRUCTION
===================== */

#instruction {
    margin-top: 15px;

    color: #cbd5e1;

    font-size: 16px;
}

/* =====================
   RESPONSIVE
===================== */

@media (max-width: 420px) {

    #startScreen h1 {
        font-size: 30px;
    }

    #startScreen p {
        font-size: 17px;
    }

    .food {
        width: 90px;
        min-height: 90px;
    }

    .foodEmoji {
        font-size: 42px;
    }

    .foodName {
        font-size: 13px;
    }

    .basket {
        min-height: 105px;
        font-size: 17px;
    }

    .basketIcon {
        font-size: 35px;
    }

}

</style>
</head>
