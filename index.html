<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>เกมคัดแยกอาหาร AR</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      overflow: hidden;
      color: white;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: black;
    }

    #output_canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .ui {
      position: absolute;
      z-index: 10;
    }

    #topBar {
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .box {
      background: rgba(0,0,0,.75);
      border: 3px solid white;
      border-radius: 18px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 20px;
    }

    #soundBtn {
      pointer-events: auto;
      cursor: pointer;
      border: none;
    }

    #feedback {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 26px;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 20px;
      display: none;
      text-align: center;
      white-space: nowrap;
    }

    #startOverlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    #startOverlay h1 {
      color: #facc15;
      font-size: 34px;
      margin-bottom: 15px;
      font-weight: 900;
    }

    #startOverlay p {
      font-size: 19px;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .levelBox {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .levelBtn {
      border: 3px solid white;
      border-radius: 15px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #334155;
      color: white;
    }

    .levelBtn.active {
      background: #facc15;
      color: #111827;
    }

    #startBtn {
      background: #facc15;
      color: #111827;
      border: 4px solid white;
      border-radius: 25px;
      padding: 18px 35px;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    #statusText {
      margin-top: 20px;
      font-size: 16px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<div id="gameContainer">

  <video
    id="input_video"
    playsinline
    muted
    style="display:none">
  </video>

  <canvas id="output_canvas"></canvas>

  <div id="topBar" class="ui">

    <div class="box">
      คะแนน: <span id="score">0</span>
    </div>

    <button id="soundBtn" class="box">
      🔊 เสียง
    </button>

  </div>

  <div id="feedback"></div>

  <!-- หน้าเริ่มเกม -->

  <div id="startOverlay">

    <h1>
      🍎 เกมคัดแยกอาหาร ☠️
    </h1>

    <p>
      ใช้นิ้วชี้แตะอาหารให้อาหารติดนิ้ว
      แล้วนำไปวางในตะกร้าที่ถูกต้อง
    </p>

    <p style="color:#4ade80;font-weight:bold;">
      🟢 สีเขียว = อาหารมีประโยชน์
    </p>

    <p style="color:#60a5fa;font-weight:bold;">
      🔵 สีน้ำเงิน = อาหารเป็นพิษ
    </p>

    <h2 style="font-size:22px;font-weight:bold;margin-bottom:10px;">
      เลือกระดับ
    </h2>

    <div class="levelBox">

      <button
        class="levelBtn active"
        data-level="easy">
        😊 ง่าย
      </button>

      <button
        class="levelBtn"
        data-level="medium">
        😎 กลาง
      </button>

      <button
        class="levelBtn"
        data-level="hard">
        🔥 ยาก
      </button>

    </div>

    <button id="startBtn">
      ▶ เริ่มเล่นเกม
    </button>

    <div id="statusText">
      กดเริ่มเกมเพื่อเปิดกล้อง
    </div>

  </div>

</div>


<script>

let score = 0;
let gameRunning = false;

let selectedLevel = "easy";

let soundEnabled = true;

let handPresent = false;

let handX = 0;
let handY = 0;

let draggedItem = null;

let cameraStarted = false;

let hands;
let camera;


/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("input_video");

const canvas = document.getElementById("output_canvas");

const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");

const feedback = document.getElementById("feedback");

const startOverlay = document.getElementById("startOverlay");

const startBtn = document.getElementById("startBtn");

const statusText = document.getElementById("statusText");

const soundBtn = document.getElementById("soundBtn");


/* =========================
   FOOD
========================= */

const foodList = [

  {
    name: "แอปเปิ้ล",
    type: "healthy",
    emoji: "🍎"
  },

  {
    name: "กล้วย",
    type: "healthy",
    emoji: "🍌"
  },

  {
    name: "แครอท",
    type: "healthy",
    emoji: "🥕"
  },

  {
    name: "บรอกโคลี",
    type: "healthy",
    emoji: "🥦"
  },

  {
    name: "เห็ดพิษ",
    type: "toxic",
    emoji: "☠️"
  },

  {
    name: "สารเคมี",
    type: "toxic",
    emoji: "🧪"
  },

  {
    name: "อาหารบูด",
    type: "toxic",
    emoji: "🤢"
  }

];

let items = [];


/* =========================
   LEVEL SETTINGS
========================= */

function getLevelSettings() {

  if (selectedLevel === "easy") {

    return {
      speed: 0.0015,
      spawn: 3000
    };

  }

  if (selectedLevel === "medium") {

    return {
      speed: 0.0025,
      spawn: 2200
    };

  }

  return {

    speed: 0.004,
    spawn: 1500

  };

}


/* =========================
   SPEECH
========================= */

function speak(text) {

  if (!soundEnabled) return;

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "th-TH";

  speech.rate = 0.9;

  speech.pitch = 1;

  window.speechSynthesis.speak(speech);

}


/* =========================
   SOUND BUTTON
========================= */

soundBtn.addEventListener("click", function() {

  soundEnabled = !soundEnabled;

  if (soundEnabled) {

    soundBtn.innerHTML = "🔊 เสียง";

    speak("เปิดเสียงแล้ว");

  } else {

    window.speechSynthesis.cancel();

    soundBtn.innerHTML = "🔇 ปิดเสียง";

  }

});


/* =========================
   LEVEL BUTTON
========================= */

document
.querySelectorAll(".levelBtn")
.forEach(function(button) {

  button.addEventListener("click", function() {

    document
    .querySelectorAll(".levelBtn")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });

    button.classList.add("active");

    selectedLevel =
      button.dataset.level;

  });

});


/* =========================
   FEEDBACK
========================= */

function showFeedback(
  text,
  success
) {

  feedback.innerText = text;

  feedback.style.display = "block";

  if (success) {

    feedback.style.background =
      "#16a34a";

  } else {

    feedback.style.background =
      "#dc2626";

  }

  setTimeout(function() {

    feedback.style.display =
      "none";

  }, 1500);

}


/* =========================
   SPAWN FOOD
========================= */

function spawnItem() {

  if (!gameRunning) return;

  const food =
    foodList[
      Math.floor(
        Math.random()
        * foodList.length
      )
    ];

  const settings =
    getLevelSettings();

  items.push({

    ...food,

    x:
      Math.random() * 0.6
      + 0.2,

    y: -0.05,

    speed:
      settings.speed
      +
      Math.random()
      * settings.speed,

    held: false

  });

}


/* =========================
   START GAME
========================= */

async function startGame() {

  try {

    startBtn.disabled = true;

    statusText.innerText =
      "กำลังเปิดกล้อง... 📷";

    /*
    ต้องขอสิทธิ์กล้อง
    จากการกดปุ่มของผู้ใช้
    เพื่อให้ iPhone รองรับ
    */

    await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user"
      },

      audio: false

    });

    score = 0;

    scoreText.innerText = score;

    items = [];

    draggedItem = null;

    gameRunning = true;

    startOverlay.style.display =
      "none";


    if (!cameraStarted) {

      setupMediaPipe();

      cameraStarted = true;

    }

    speak("เริ่มเกมได้เลยค่ะ");

    spawnItem();

  }

  catch(error) {

    console.error(error);

    startBtn.disabled = false;

    statusText.innerText =
      "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องใน Safari";

  }

}


/* =========================
   START BUTTON
========================= */

startBtn.addEventListener(
  "click",
  startGame
);


/* =========================
   MEDIAPIPE
========================= */

function setupMediaPipe() {

  hands =
    new Hands({

      locateFile:
        function(file) {

          return
          "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
          + file;

        }

    });


  hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 0,

    minDetectionConfidence:
      0.5,

    minTrackingConfidence:
      0.5

  });


  hands.onResults(
    onResults
  );


  camera =
    new Camera(

      video,

      {

        onFrame:
          async function() {

            await hands.send({

              image: video
